packages:
  - 'apps/*'
  - 'packages/*'

# Pin exact versions (reproducible builds).
saveExact: true

# Dependencies allowed to run install scripts (everything else is blocked by default).
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21'
  - '@expo/metro-config@58.0.23'
  - '@expo/router-server@58.0.23'
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
  - expo-router@58.0.32
  - nestjs-pino@5.3.2
