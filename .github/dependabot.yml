# FIXES F19: grouped, patch/minor-only update PRs. Majors need an ADR (AGENTS.md), so they are ignored here.
# Versions stay exact pins (.npmrc save-exact); Dependabot keeps them exact.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      api-and-shared:
        patterns: ['*']
        exclude-patterns: ['expo*', '@expo/*', 'react-native*', 'react', 'react-dom']
        update-types: ['minor', 'patch']
      mobile:
        patterns: ['expo*', '@expo/*', 'react-native*', 'react', 'react-dom']
        update-types: ['patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # TypeScript 7 breaks ts-jest / typescript-eslint / Nest Swagger peers (AGENTS.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
