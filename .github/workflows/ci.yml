name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API e2e tests (database mocked)
        run: pnpm --filter @ksms/api test:e2e
      - run: pnpm build
      - name: Prisma schema validation
        run: pnpm --filter @ksms/api db:validate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

  migrations:
    name: Apply migrations to a clean Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway database; not a secret.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" build
      - name: Apply all migrations
        run: pnpm db:migrate:deploy
      - name: Confirm schema is up to date
        run: pnpm db:status
      - name: Real-database concurrency tests
        run: pnpm --filter @ksms/api test:int
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  mobile:
    name: Mobile bundle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @ksms/mobile typecheck
      - run: pnpm --filter @ksms/mobile export:check

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the commits being pushed
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fails on high or critical advisories in production dependencies. Known, accepted advisories are
      # listed with a reason and a review date in pnpm-workspace.yaml (auditConfig) and docs/security/AUDIT_ALLOWLIST.md.
      - name: pnpm audit (production, high and critical)
        run: pnpm audit --prod --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build the API image and smoke-test it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway database; not a secret.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Apply migrations (from CI, never from the container)
        run: |
          pnpm install --frozen-lockfile --filter "@ksms/api..."
          pnpm --filter "./packages/*" build
          pnpm db:migrate:deploy
      - name: Build image
        run: docker build -t ksms-api:ci .
      - name: Image size and user
        run: |
          docker image ls ksms-api:ci
          test "$(docker run --rm --entrypoint id ksms-api:ci -u)" != "0"
      - name: Boot, readiness and a real login (argon2 native module)
        run: |
          docker run -d --name api --network host             -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci             -e JWT_ACCESS_SECRET=ci-only-secret-ci-only-secret-0000000             -e PLATFORM_JWT_SECRET=ci-only-platform-secret-ci-only-platform-secret-00             -e PLATFORM_MFA_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=             -e PORT=3000 ksms-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/v1/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/v1/health/ready
          curl -fsS -X POST http://localhost:3000/api/v1/auth/register-owner             -H 'Content-Type: application/json'             -d '{"fullName":"CI Owner","phone":"9876500001","password":"Ci-Passw0rd!","shopName":"CI Shop","deviceUid":"ci-device-0001"}' > /dev/null
          curl -fsS -X POST http://localhost:3000/api/v1/auth/login             -H 'Content-Type: application/json'             -d '{"identifier":"9876500001","password":"Ci-Passw0rd!","deviceUid":"ci-device-0001"}' > /dev/null
          echo "image boots, database ready, login works"
      - name: Container logs
        if: always()
        run: docker logs api || true
