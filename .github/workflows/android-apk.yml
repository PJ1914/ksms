name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/api/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public value baked into the app. Set it in: Settings > Secrets and variables > Actions > Variables.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000/api/v1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set versionCode from run number
        working-directory: apps/mobile/android/app
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle

      # Note: Expo's template signs release builds with its debug key, so the APK installs on any phone.
      # For Play Store you'd switch to your own keystore later.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee ../gradle.log || {
            echo "::error title=Gradle failed::$(grep -E 'FAILED|What went wrong|error:|Caused by|Could not' -A3 ../gradle.log | tail -25 | tr -d '%' | paste -sd '~' -)"
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/ksms-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksms-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: apk-${{ github.run_number }}
          name: KSMS APK #${{ github.run_number }}
          body: Automated build of ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
