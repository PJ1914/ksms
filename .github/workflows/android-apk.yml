name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/api/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public value baked into the app. Set it in: Settings > Secrets and variables > Actions > Variables.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000/api/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Set versionCode from run number
        working-directory: apps/mobile/android/app
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle

      # Note: Expo's template signs release builds with its debug key, so the APK installs on any phone.
      # For Play Store you'd switch to your own keystore later.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee ../gradle.log || {
            echo "::error title=Gradle failed::$(grep -E 'FAILED|What went wrong|error:|Caused by|Could not' -A3 ../gradle.log | tail -25 | tr -d '%' | tr '
' '~')"
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/ksms-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ksms-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: KSMS APK #${{ github.run_number }}
          body: Automated build of ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
