name: Keep the API awake (shop hours)

# FIXES F20, option A (free): Render's free web service sleeps after 15 minutes without traffic and Neon
# scales to zero, so the first bill of the morning waited ~30-60 s. This pings /health/ready (which also
# wakes the database) every 10 minutes from 07:00 to 23:00 IST only. Health probes are not rate limited
# (@SkipThrottle) and not logged (F6). Uses the existing repository variable EXPO_PUBLIC_API_URL
# (the API base URL baked into the app, e.g. https://<service>.onrender.com/api/v1).
# Option B (no sleep at all) is Render's paid plan; see docs/TECHNICAL_DECISIONS.md TD-141.

on:
  schedule:
    # 01:30-17:29 UTC = 07:00-22:59 IST. GitHub may start scheduled runs a few minutes late.
    - cron: '30-59/10 1 * * *'
    - cron: '*/10 2-17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Ping /health/ready
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "::warning::EXPO_PUBLIC_API_URL is not an https URL; skipping."; exit 0 ;;
          esac
          for i in 1 2 3; do
            if curl -fsS --max-time 60 "$API_URL/health/ready"; then exit 0; fi
            sleep 10
          done
          echo "::warning::API did not answer /health/ready"
